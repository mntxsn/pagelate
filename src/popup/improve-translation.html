<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/w3css/4/w3.css" />
  <link rel="stylesheet" href="/css/twp-theme.css" />
  <script src="/css/twp-theme.js"></script>
  <style>
    body {
      user-select: none;
      min-width: 300px;
      padding: 4px;
    }

    #mdiv {
      width: 14px;
      height: 14px;
    }

    .mdiv {
      height: 15px;
      width: 2px;
      margin-left: 5px;
      background-color: var(--twp-text);
      transform: rotate(45deg);
      z-index: 1;
    }

    .md {
      height: 15px;
      width: 2px;
      background-color: var(--twp-text);
      transform: rotate(90deg);
      z-index: 2;
    }

    #btnClose {
      border-radius: 50%;
      position: relative;
      padding: 7px;
      cursor: pointer;
    }

    #btnClose:hover {
      background-color: var(--twp-surface-2);
    }

    .improve-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px 6px;
    }

    .improve-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .settings-card {
      margin: 0 10px;
    }

    .select {
      width: 100%;
    }

    #btnApply {
      width: calc(100% - 20px);
      margin: 10px;
    }
  </style>
</head>

<body>
  <div class="improve-header">
    <h2 class="improve-title" data-i18n="msgImproveTranslation">Translation options</h2>
    <div id="btnClose" title="Close">
      <div id="mdiv">
        <div class="mdiv">
          <div class="md"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="settings-card">
    <div class="setting-row is-stacked">
      <div class="setting-text">
        <label class="setting-title" for="selectOriginalLanguage" data-i18n="selectOriginalLanguage">Select the original
          website language</label>
      </div>
      <div class="setting-control">
        <select class="select" id="selectOriginalLanguage">
          <optgroup name="group_1" label="Recents" data-i18n-label="msgRecents">
            <option value="auto" selected data-i18n="msgAutoDetect">Auto-detect</option>
          </optgroup>
          <optgroup name="group_2" label="All" data-i18n-label="msgAll"></optgroup>
        </select>
      </div>
    </div>
    <div class="setting-row is-stacked">
      <div class="setting-text">
        <label class="setting-title" for="selectTargetLanguage" data-i18n="selectTargetLanguage">Select target
          language</label>
      </div>
      <div class="setting-control">
        <select class="select" id="selectTargetLanguage">
          <optgroup name="targets" label="Recents" data-i18n-label="msgRecents"></optgroup>
          <optgroup name="all" label="All" data-i18n-label="msgAll"></optgroup>
        </select>
      </div>
    </div>
    <div class="setting-row is-stacked">
      <div class="setting-text">
        <label class="setting-title" for="pageTranslatorService" data-i18n="lblPageTranslationService">Page translation
          service</label>
      </div>
      <div class="setting-control">
        <select class="select" id="pageTranslatorService">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
        </select>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-text">
        <label class="setting-title" for="dontSortResults" data-i18n="lblDontSortResults">Do not sort translation
          results</label>
      </div>
      <div class="setting-control">
        <input type="checkbox" class="switch" id="dontSortResults">
      </div>
    </div>
  </div>

  <button class="w3-button w3-blue w3-round" data-i18n="btnApply" id="btnApply">Apply</button>

  <script src="/lib/checkedLastError.js"></script>
  <script src="/lib/stuff.js"></script>
  <script src="/lib/languages.js"></script>
  <script src="/lib/config.js"></script>
  <script src="/lib/i18n.js"></script>
  <script src="improve-translation.js"></script>
</body>

</html>
