<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/w3css/4/w3.css">
    <link rel="stylesheet" href="/css/twp-theme.css">
    <link rel="stylesheet" href="popup.css">
    <script src="/css/twp-theme.js"></script>
</head>

<body style="width: 360px;">
    <div class="popup-header">
        <div id="divIconTranslate" title="Switch between translation services"
            data-i18n-title="swapTranslationService">
            <img id="iconTranslate" src="/icons/google-translate-32.png">
        </div>
        <div class="popup-header-spacer"></div>
        <div class="popup-icon-btn" id="btnPatreon" title="patreon" data-i18n-title="lblMakeDonation">
            <i class="gg-heart" style="scale: 0.85"></i>
        </div>
        <div class="popup-icon-btn" id="btnMenu" title="More options" data-i18n-title="btnMoreOptions">
            <div class="menuDot"></div>
        </div>
    </div>

    <div class="w3-bar lang-bar" data-popupPanelSection="0">
        <button class="w3-bar-item w3-button w3-ripple w3-hover-light-blue w3-buttonSelected"
            style="border-radius: 5px 0px 0px 0px; position: relative;" title="Show original"
            data-i18n-title="btnRestore" value="original"><span data-i18n="btnMobileOriginal">Original</span><span
                style="font-size: 9px; position: absolute; bottom: 0; left: 5px;"
                class="w3-text-pale-blue">Unknown</span></button>
        <button class="w3-bar-item w3-button w3-ripple w3-hover-light-blue" style="border-radius: 0px 5px 0px 0px;"
            title="Translate" data-i18n-title="btnTranslate" value="en">English</button>
    </div>
    <div class="w3-bar lang-bar" data-popupPanelSection="2">
        <button class="w3-bar-item w3-button w3-ripple w3-hover-light-blue" style="border-radius: 0px 0px 0px 5px;"
            title="Translate" data-i18n-title="btnTranslate" value="es">Spanish</button>
        <button class="w3-bar-item w3-button w3-ripple w3-hover-light-blue" style="border-radius: 0px 0px 5px 0px;"
            title="Translate" data-i18n-title="btnTranslate" value="de">German</button>
    </div>

    <div class="w3-container w3-margin-top popup-settings" style="font-weight: 500">
        <div data-popupPanelSection="0">
            <div style="margin-bottom: 10px;">
                <button data-i18n="msgImproveTranslation" id="btnImproveTranslation">Improve translation</button>
            </div>
            <div id="divAlwaysTranslateThisLang" class="setting-row">
                <div class="setting-text">
                    <label class="setting-title" id="lblAlwaysTranslateThisLang" for="cbAlwaysTranslateThisLang"
                        data-i18n="lblAlwaysTranslate" data-i18n-ph-value="">Always translate from</label>
                </div>
                <div class="setting-control">
                    <input type="checkbox" class="w3-check" id="cbAlwaysTranslateThisLang" disabled>
                </div>
            </div>
        </div>
        <div data-popupPanelSection="1">
            <div class="setting-row">
                <div class="setting-text">
                    <label class="setting-title" for="cbAlwaysTranslateThisSite" data-i18n="btnAlwaysTranslate">Always
                        translate this site</label>
                </div>
                <div class="setting-control">
                    <input type="checkbox" class="w3-check" id="cbAlwaysTranslateThisSite">
                </div>
            </div>
        </div>
        <div data-popupPanelSection="3">
            <hr>
        </div>
        <div data-popupPanelSection="3">
            <div class="setting-row">
                <div class="setting-text">
                    <label class="setting-title" for="cbShowTranslateSelectedButton"
                        data-i18n="lblShowTranslateSelectedButton">Show the button to translate the selected
                        text</label>
                </div>
                <div class="setting-control">
                    <input type="checkbox" class="w3-check" id="cbShowTranslateSelectedButton">
                </div>
            </div>
        </div>
        <div data-popupPanelSection="4">
            <div class="setting-row">
                <div class="setting-text">
                    <label class="setting-title" for="cbShowOriginalWhenHovering"
                        data-i18n="lblShowOriginalTextWhenHovering">Show original text when hovering</label>
                </div>
                <div class="setting-control">
                    <input type="checkbox" class="w3-check" id="cbShowOriginalWhenHovering">
                </div>
            </div>
        </div>
        <div data-popupPanelSection="5">
            <hr>
        </div>
        <div data-popupPanelSection="5">
            <div class="setting-row">
                <div class="setting-text">
                    <label class="setting-title" for="cbShowTranslatedWhenHoveringThisSite"
                        data-i18n="lblShowTranslatedWhenHoveringThisSite">Show translation when hovering over this
                        site</label>
                </div>
                <div class="setting-control">
                    <input type="checkbox" class="w3-check" id="cbShowTranslatedWhenHoveringThisSite">
                </div>
            </div>
        </div>
        <div data-popupPanelSection="6">
            <div id="divShowTranslatedWhenHoveringThisLang" class="setting-row">
                <div class="setting-text">
                    <label class="setting-title" id="lblShowTranslatedWhenHoveringThisLang"
                        for="cbShowTranslatedWhenHoveringThisLang" data-i18n="lblShowTranslatedWhenHoveringThisLang"
                        data-i18n-ph-value="">Show translation when hovering over websites in</label>
                </div>
                <div class="setting-control">
                    <input type="checkbox" class="w3-check" id="cbShowTranslatedWhenHoveringThisLang" disabled>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div id="moreOrLess" style="height: 32px;">
        <div id="more" class="w3-display-bottomleft w3-hover-light-grey"
            style="padding: 8px 60px 8px 20px; font-weight: 500;">
            <span data-i18n="more">More</span>&nbsp;&nbsp;&nbsp;<i class="arrow down"></i>
        </div>
        <div id="less" class="w3-display-bottomright w3-hover-light-grey"
            style="padding: 8px 20px 8px 60px; font-weight: 500;">
            <i class="arrow up"></i>&nbsp;&nbsp;&nbsp;<span data-i18n="less">Less</span>
        </div>
    </div>

    <script src="/lib/checkedLastError.js"></script>
    <script src="/lib/stuff.js"></script>
    <script src="/lib/languages.js"></script>
    <script src="/lib/config.js"></script>
    <script src="/lib/i18n.js"></script>
    <script src="popup.js"></script>
</body>

</html>
